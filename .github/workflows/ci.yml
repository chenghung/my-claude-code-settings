name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Show shellcheck version
        run: shellcheck --version
      - name: Run shellcheck
        run: git ls-files -z '*.sh' '*.bats' | xargs -0 shellcheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y bats zsh
      - name: Run tests
        run: |
          failed=()
          for t in tests/*.sh hooks/tests/*.sh; do
            echo "::group::$t"
            if ! bash "$t"; then failed+=("$t"); fi
            echo "::endgroup::"
          done
          if ! bats hooks/tests/; then failed+=("bats hooks/tests/"); fi
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
